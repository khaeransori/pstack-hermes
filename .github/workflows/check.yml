name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # dist/ is not committed, so build it, then fail if the committed skills/ differ from the build.
      - run: python3 generate.py
      - run: python3 generate.py --check
      - run: |
          git status --porcelain -- skills
          test -z "$(git status --porcelain -- skills)"
